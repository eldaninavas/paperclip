name: Foundation startup probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: mx-central-1
      - name: Capture production startup output behind Cloudflare Access
        run: |
          aws ecs describe-task-definition --task-definition foundation-prod --query taskDefinition > task-definition.json
          PROBE='node --import ./server/node_modules/tsx/dist/loader.mjs server/dist/index.js >/tmp/foundation-startup.log 2>&1 & app=$!; sleep 45; if kill -0 "$app" 2>/dev/null; then echo "[probe] application remained running for 45 seconds" >>/tmp/foundation-startup.log; kill "$app" 2>/dev/null || true; wait "$app" 2>/dev/null || true; fi; node -e '\''const fs=require("fs"),http=require("http"); http.createServer((req,res)=>{res.writeHead(200,{"content-type":"text/plain; charset=utf-8","cache-control":"no-store"}); res.end(fs.readFileSync("/tmp/foundation-startup.log","utf8"))}).listen(3100,"0.0.0.0")'\'''
          jq --arg probe "$PROBE" '
            .containerDefinitions |= map(
              if .name == "foundation" then
                .entryPoint = ["/usr/bin/tini","--"]
                | .command = ["sh","-lc",$probe]
                | .healthCheck = {"command":["CMD-SHELL","curl -fsS http://127.0.0.1:3100/ || exit 1"],"interval":10,"timeout":5,"retries":10,"startPeriod":60}
              else . end
            )
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
          ' task-definition.json > probe-task-definition.json
          TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://probe-task-definition.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster foundation --service foundation-prod --task-definition "$TASK_ARN" --desired-count 1 --force-new-deployment
          aws ecs wait services-stable --cluster foundation --services foundation-prod
