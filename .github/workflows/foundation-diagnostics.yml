name: Foundation diagnostics

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to inspect
        required: true
        default: production
        type: choice
        options:
          - development
          - production

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: mx-central-1
      - name: Inspect ECS service
        env:
          SERVICE: foundation-${{ inputs.environment == 'production' && 'prod' || 'dev' }}
        run: |
          SERVICE_JSON=$(aws ecs describe-services \
            --region mx-central-1 \
            --cluster foundation \
            --services "$SERVICE" \
            --output json)
          echo "$SERVICE_JSON" | jq '.services[0] | {desired: .desiredCount, running: .runningCount, pending: .pendingCount, deployments: [.deployments[] | {status, rollout: .rolloutState, reason: .rolloutStateReason, desired: .desiredCount, running: .runningCount, pending: .pendingCount, failed: .failedTasks, taskDefinition}], events: [.events[0:15][] | {at: .createdAt, message}]}'
          TARGET_GROUP=$(echo "$SERVICE_JSON" | jq -r '.services[0].loadBalancers[0].targetGroupArn')
          for attempt in {1..18}; do
            aws elbv2 describe-target-health \
              --region mx-central-1 \
              --target-group-arn "$TARGET_GROUP" \
              --query 'TargetHealthDescriptions[].{target:Target.Id,port:Target.Port,state:TargetHealth.State,reason:TargetHealth.Reason,description:TargetHealth.Description}' \
              --output json
            sleep 10
          done
