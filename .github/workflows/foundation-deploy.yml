name: Foundation deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Promote the exact tested image to production
        required: true
        default: false
        type: boolean
      image_tag:
        description: Optional previously built commit SHA to redeploy or roll back
        required: false
        type: string
      keep_development_running:
        description: Leave development up after the deploy instead of scaling it to zero
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: mx-central-1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build server TypeScript dependencies
        run: |
          pnpm --filter @paperclipai/paperclip-runner build:typescript
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - name: Type-check server without rebuilding the native runner
        run: pnpm --dir server exec tsc --noEmit
      - run: pnpm --filter @paperclipai/ui typecheck
      - run: pnpm --filter @paperclipai/ui build
      # The deploy rewrites the task definition with a jq filter held in a bash
      # single-quoted string, and a stray apostrophe truncates it — a failure
      # that only surfaces after a full image build. Compile the filters here,
      # where it costs seconds.
      - name: Check the deploy jq filters compile
        run: node scripts/check-deploy-workflow-jq.mjs

  build-and-deploy-development:
    needs: verify
    runs-on: ubuntu-24.04-arm
    environment: development
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
          REPOSITORY: foundation/server
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: echo "uri=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - if: inputs.image_tag == ''
        uses: docker/setup-buildx-action@v3
      - if: inputs.image_tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
            PAPERCLIP_BUILD_VERSION=foundation-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy immutable image to development
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
          CLUSTER: foundation
          SERVICE: foundation-dev
          FAMILY: foundation-dev
          TARGET_GROUP: ${{ vars.AWS_TARGET_GROUP_ARN }}
          # Foundation Cloud runs the agent against Bedrock in Foundation's own
          # account, so the model configuration belongs to the deployment, not
          # to each tenant's agent: a customer never supplies an AWS credential.
          BEDROCK_MODEL: ${{ vars.FOUNDATION_BEDROCK_MODEL }}
          # Durable run logs. Unset -> run-log-store degrades to local files
          # (see resolveRunLogS3), which is the pre-Foundation-Cloud behaviour,
          # so a missing variable weakens durability without breaking a deploy.
          RUN_LOG_BUCKET: ${{ vars.RUN_LOG_S3_BUCKET }}
        run: |
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition > task-definition.json
          # Every Foundation-Cloud variable is stripped before being re-added so
          # the task definition converges on what this workflow declares instead
          # of accumulating stale copies across revisions.
          jq --arg image "$IMAGE" --arg model "$BEDROCK_MODEL" --arg bucket "$RUN_LOG_BUCKET" '
            .containerDefinitions |= map(
              if .name == "foundation" then
                .image = $image
                | .environment = (
                    ((.environment // []) | map(select(
                      .name != "FOUNDATION_CLOUD_EXECUTION"
                      and .name != "CLAUDE_CODE_USE_BEDROCK"
                      and .name != "ANTHROPIC_MODEL"
                      and .name != "AWS_REGION"
                      and .name != "RUN_LOG_S3_BUCKET"
                      and .name != "RUN_LOG_S3_REGION"
                      and .name != "RUN_LOG_S3_PREFIX"
                      and .name != "RUN_LOG_S3_FORCE_PATH_STYLE"
                      and .name != "RUN_LOG_S3_INFLIGHT_MIRROR_SECONDS"
                    )))
                    + [
                        {"name":"FOUNDATION_CLOUD_EXECUTION","value":"true"},
                        # Claude Code talks to Bedrock instead of api.anthropic.com.
                        # Bedrock is available in mx-central-1, the same region as
                        # this cluster, so tenant tokens never leave the region
                        # the service runs in.
                        {"name":"CLAUDE_CODE_USE_BEDROCK","value":"1"},
                        {"name":"AWS_REGION","value":"mx-central-1"}
                      ]
                    + (if $model == "" then [] else [{"name":"ANTHROPIC_MODEL","value":$model}] end)
                    + (if $bucket == "" then [] else [
                        {"name":"RUN_LOG_S3_BUCKET","value":$bucket},
                        {"name":"RUN_LOG_S3_REGION","value":"mx-central-1"},
                        {"name":"RUN_LOG_S3_PREFIX","value":"run-logs"},
                        # Real AWS S3 rejects path-style addressing; the store
                        # defaults to true for S3-compatible endpoints.
                        {"name":"RUN_LOG_S3_FORCE_PATH_STYLE","value":"false"},
                        # Mirror the tail every 30s so a rolled task loses at
                        # most half a minute of agent output for one tenant.
                        {"name":"RUN_LOG_S3_INFLIGHT_MIRROR_SECONDS","value":"30"}
                      ] end)
                  )
              else . end
            )
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
          ' task-definition.json > next-task-definition.json
          TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://next-task-definition.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$TASK_ARN" --desired-count 1 --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          aws elbv2 wait target-in-service --target-group-arn "$TARGET_GROUP"
      - name: Verify development health through Cloudflare Access
        env:
          HEALTH_URL: https://foundation-dev.davaria.app/api/health
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' "$HEALTH_URL")
          test "$STATUS" = "302" || test "$STATUS" = "401"
      # Development is scaled back down because an idle task still bills, and
      # the infrastructure budget for this account is about USD 50/month. It is
      # a cost control, not a deployment step, which is why it runs even when
      # the deploy failed -- a broken revision must not be left running either.
      #
      # Anything that has to exercise the running instance (a Foundation Cloud
      # run, a ledger check, an S3 round trip) needs dev up after the workflow
      # ends, so the scale-down is skippable per dispatch rather than by editing
      # this file. Default is unchanged: dev goes back to zero.
      - name: Scale development back to zero
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.keep_development_running)
        env:
          CLUSTER: foundation
          SERVICE: foundation-dev
        run: aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --desired-count 0
      - name: Report that development was left running
        if: always() && github.event_name == 'workflow_dispatch' && inputs.keep_development_running
        run: |
          echo "::warning::foundation-dev was left at desired-count 1 on purpose."
          echo "::warning::It bills until the next deploy scales it down, or until you do."

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    needs: build-and-deploy-development
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Promote tested image to production
        env:
          IMAGE: ${{ needs.build-and-deploy-development.outputs.image }}
          CLUSTER: foundation
          SERVICE: foundation-prod
          FAMILY: foundation-prod
          # Same Foundation Cloud configuration as development, so promoting an
          # image cannot quietly move production onto a different model or drop
          # its durable run logs. Both come from the production environment's
          # own variables; an unset bucket degrades to local files rather than
          # failing the promotion.
          BEDROCK_MODEL: ${{ vars.FOUNDATION_BEDROCK_MODEL }}
          RUN_LOG_BUCKET: ${{ vars.RUN_LOG_S3_BUCKET }}
        run: |
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition > task-definition.json
          START_COMMAND='case "$DATABASE_URL" in *sslmode=*) ;; *\?*) DATABASE_URL="${DATABASE_URL}&sslmode=require" ;; *) DATABASE_URL="${DATABASE_URL}?sslmode=require" ;; esac; export DATABASE_URL; exec node --import ./server/node_modules/tsx/dist/loader.mjs server/dist/index.js'
          jq --arg image "$IMAGE" --arg startCommand "$START_COMMAND" --arg model "$BEDROCK_MODEL" --arg bucket "$RUN_LOG_BUCKET" '
            .containerDefinitions |= map(
              if .name == "foundation" then
                .image = $image
                | del(.entryPoint)
                | .command = ["sh","-lc",$startCommand]
                | .environment = (
                    ((.environment // []) | map(select(
                      .name != "PGSSLMODE"
                      and .name != "BOOTSTRAP_TOKEN_HASH"
                      and .name != "BOOTSTRAP_SCRIPT_B64"
                      and .name != "FOUNDATION_CLOUD_EXECUTION"
                      and .name != "PAPERCLIP_DEPLOYMENT_EXPOSURE"
                      and .name != "CLAUDE_CODE_USE_BEDROCK"
                      and .name != "ANTHROPIC_MODEL"
                      and .name != "AWS_REGION"
                      and .name != "RUN_LOG_S3_BUCKET"
                      and .name != "RUN_LOG_S3_REGION"
                      and .name != "RUN_LOG_S3_PREFIX"
                      and .name != "RUN_LOG_S3_FORCE_PATH_STYLE"
                      and .name != "RUN_LOG_S3_INFLIGHT_MIRROR_SECONDS"
                    )))
                    + [
                        {"name":"FOUNDATION_CLOUD_EXECUTION","value":"true"},
                        {"name":"PAPERCLIP_DEPLOYMENT_EXPOSURE","value":"public"},
                        {"name":"CLAUDE_CODE_USE_BEDROCK","value":"1"},
                        {"name":"AWS_REGION","value":"mx-central-1"}
                      ]
                    + (if $model == "" then [] else [{"name":"ANTHROPIC_MODEL","value":$model}] end)
                    + (if $bucket == "" then [] else [
                        {"name":"RUN_LOG_S3_BUCKET","value":$bucket},
                        {"name":"RUN_LOG_S3_REGION","value":"mx-central-1"},
                        {"name":"RUN_LOG_S3_PREFIX","value":"run-logs"},
                        {"name":"RUN_LOG_S3_FORCE_PATH_STYLE","value":"false"},
                        {"name":"RUN_LOG_S3_INFLIGHT_MIRROR_SECONDS","value":"30"}
                      ] end)
                  )
                | .healthCheck = {"command":["CMD-SHELL","curl -fsS http://127.0.0.1:3100/api/health || exit 1"],"interval":30,"timeout":5,"retries":3,"startPeriod":90}
              else . end
            )
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
          ' task-definition.json > next-task-definition.json
          TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://next-task-definition.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$TASK_ARN" --desired-count 1 --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
