name: Foundation bootstrap first admin

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: foundation-bootstrap-admin
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: mx-central-1
      - name: Install one-time first-admin invite
        env:
          BOOTSTRAP_HASH: d27ec4116ef86174c2c6ae66097aa6e67a73139a7f067a7fbdb0b37720ebf828
          BOOTSTRAP_SCRIPT_B64: 
        run: |
          aws ecs describe-task-definition --task-definition foundation-prod --query taskDefinition > task-definition.json
          START_COMMAND='case "$DATABASE_URL" in *sslmode=*) ;; *\?*) DATABASE_URL="${DATABASE_URL}&sslmode=require" ;; *) DATABASE_URL="${DATABASE_URL}?sslmode=require" ;; esac; export DATABASE_URL; node --input-type=module -e "$(printf %s "$BOOTSTRAP_SCRIPT_B64" | base64 -d)"; exec node --import ./server/node_modules/tsx/dist/loader.mjs server/dist/index.js'
          jq --arg hash "$BOOTSTRAP_HASH" --arg script "$BOOTSTRAP_SCRIPT_B64" --arg startCommand "$START_COMMAND" '
            .containerDefinitions |= map(
              if .name == "foundation" then
                del(.entryPoint)
                | .command = ["sh","-lc",$startCommand]
                | .environment = ((.environment // []) | map(select(.name != "BOOTSTRAP_TOKEN_HASH" and .name != "BOOTSTRAP_SCRIPT_B64")) + [
                    {"name":"BOOTSTRAP_TOKEN_HASH","value":$hash},
                    {"name":"BOOTSTRAP_SCRIPT_B64","value":$script}
                  ])
              else . end
            )
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
          ' task-definition.json > next-task-definition.json
          TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://next-task-definition.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster foundation --service foundation-prod --task-definition "$TASK_ARN" --desired-count 1 --force-new-deployment
          aws ecs wait services-stable --cluster foundation --services foundation-prod
